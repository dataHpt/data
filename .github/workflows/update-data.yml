name: Update API Data

# Triggers
on:
  # Manual trigger para testing
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Skip API fetch (use static only)'
        required: false
        default: 'false'

  # Scheduled: Daily at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'

  # On push to scripts (for CI testing)
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

env:
  R_VERSION: '4.3'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necessário para fazer commit

    steps:
      # 1. Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup R environment
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # 3. Cache R packages
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ~/work/_temp/Library
          key: ${{ runner.os }}-r-packages-${{ hashFiles('scripts/**/*.R') }}
          restore-keys: |
            ${{ runner.os }}-r-packages-

      # 4. Cache API fetches
      - name: Cache API data
        uses: actions/cache@v3
        with:
          path: .cache/indicators
          key: ${{ runner.os }}-api-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-api-

      # 5. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev

      # 6. Install R packages
      - name: Install R packages
        run: |
          install.packages(c(
            "tidyverse",
            "jsonlite",
            "glue",
            "lubridate",
            "httr",
            "readxl",
            "memoise",
            "testthat"
          ), repos = "https://cran.rstudio.com/")
        shell: Rscript {0}

      # 7. Extract Excel baseline (if reference file exists)
      - name: Extract Excel baseline
        run: |
          if [ -f "reference/Estrutura_Indicadores_DataH_28102025.xlsx" ]; then
            Rscript scripts/00-extract-excel-data.R
          else
            echo "No Excel reference file found, using existing cache"
          fi
        continue-on-error: false

      # 8. Run data pipeline
      - name: Data Integration (API + Static)
        run: |
          Rscript scripts/02-integrate-all-data.R
        continue-on-error: false

      - name: Normalize indicators
        run: |
          Rscript scripts/03-normalize.R
        continue-on-error: false

      - name: Generate JSON files
        run: |
          Rscript scripts/04-generate-json.R
        continue-on-error: false

      # 9. Run validation tests
      - name: Validate generated data
        id: validation
        run: |
          Rscript scripts/05-validate.R
        continue-on-error: true

      # 10. Check if there are changes to commit
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet v1/ LAST_UPDATE.json || echo "has_changes=true" >> $GITHUB_OUTPUT

      # 11. Commit and push if validation passed
      - name: Commit and push data
        if: steps.validation.outcome == 'success' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add v1/
          git add LAST_UPDATE.json

          cat <<EOF > commit_msg.txt
          Update API data - $(date +'%Y-%m-%d')

          - 49 indicators across 308 municipalities
          - Generated JSON files with new hierarchy (no gavetas)
          - All validation checks passed

          🤖 Generated with GitHub Actions
          EOF

          git commit -F commit_msg.txt
          git push

      # 12. Create issue se validation falhou
      - name: Create issue on validation failure
        if: steps.validation.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Data validation failed - ' + new Date().toISOString().split('T')[0],
              body: `The automated data update workflow failed validation.

              **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              **Possible causes:**
              - INE/DGT API changes
              - Data quality issues
              - Structural problems in JSON generation

              **Next steps:**
              1. Review the workflow logs
              2. Check data sources
              3. Run validation locally: \`Rscript scripts/05-validate.R\`

              cc: @${context.repo.owner}`,
              labels: ['bug', 'automated', 'data-update']
            })

      # 13. Summary output
      - name: Job summary
        if: always()
        run: |
          echo "## Data Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **R Version:** ${{ env.R_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation:** ${{ steps.validation.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes:** ${{ steps.check_changes.outputs.has_changes || 'none' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f LAST_UPDATE.json ]; then
            echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat LAST_UPDATE.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
